[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenant-engine"
version = "0.0.0"
description = "Recovery probability model, policy function, synthetic generator, estimators"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.5",
    "groq>=1.7",
    "python-dotenv>=1.0",
    "revenant-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
